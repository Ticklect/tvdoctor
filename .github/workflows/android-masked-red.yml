name: Android masked observer RED proof

on:
  push:
    branches: [fix/android-v2-foreground-integrity]
    paths:
      - .github/workflows/android-masked-red.yml

permissions:
  contents: read

jobs:
  prove-masked-observer-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build:packages
      - name: Require the pre-fix suite to fail
        shell: bash
        run: |
          set +e
          npm test --workspace @tvdoctor/driver-android -- android-v2-foreground-regression.test.ts
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected the foreground regression suite to be RED before the host-side fix." >&2
            exit 1
          fi
          echo "RED confirmed with exit code $status."
