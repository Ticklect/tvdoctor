name: Android foreground GREEN apply

on:
  push:
    branches: [fix/android-v2-foreground-integrity]
    paths:
      - .github/workflows/android-green-apply.yml

permissions:
  contents: write

jobs:
  apply-verify-and-commit:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out fix branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/android-v2-foreground-integrity

      - name: Normalize checkout line endings
        shell: pwsh
        run: |
          git config core.autocrlf false
          git reset --hard HEAD

      - name: Configure Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm

      - name: Configure Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"

      - name: Install pinned Android SDK components
        shell: pwsh
        run: |
          sdkmanager.bat "platforms;android-36" "build-tools;36.0.0"
          if ($LASTEXITCODE -ne 0) { throw "Pinned Android SDK installation failed." }

      - name: Install locked dependencies
        run: npm ci

      - name: Apply assertion-checked source transforms
        run: python scripts/apply-android-v2-foreground-fix.py

      - name: Build host packages
        run: npm run build:packages

      - name: Rebuild tracked observer APK and manifest
        shell: pwsh
        run: npm --workspace @tvdoctor/driver-android run build:observer

      - name: Verify packaged observer identity
        run: npm --workspace @tvdoctor/driver-android run verify:observer

      - name: Targeted GREEN regressions
        shell: pwsh
        run: |
          npm test --workspace @tvdoctor/driver-android -- android-v2-foreground-regression.test.ts
          if ($LASTEXITCODE -ne 0) { throw "Android driver foreground regression suite failed." }
          npm test --workspace tvdoctor -- android-foreground-regression.test.ts
          if ($LASTEXITCODE -ne 0) { throw "Android CLI foreground regression suite failed." }

      - name: Full relevant unit suites
        shell: pwsh
        run: |
          npm test --workspace @tvdoctor/driver-android
          if ($LASTEXITCODE -ne 0) { throw "Android driver unit suite failed." }
          npm test --workspace @tvdoctor/core
          if ($LASTEXITCODE -ne 0) { throw "Core unit suite failed." }
          npm test --workspace tvdoctor
          if ($LASTEXITCODE -ne 0) { throw "CLI unit suite failed." }

      - name: Relevant typechecks
        shell: pwsh
        run: |
          npm run typecheck --workspace @tvdoctor/driver-android
          if ($LASTEXITCODE -ne 0) { throw "Android driver typecheck failed." }
          npm run typecheck --workspace @tvdoctor/core
          if ($LASTEXITCODE -ne 0) { throw "Core typecheck failed." }
          npm run typecheck --workspace tvdoctor
          if ($LASTEXITCODE -ne 0) { throw "CLI typecheck failed." }

      - name: Lint changed TypeScript and security harness
        shell: pwsh
        run: |
          npx eslint packages/driver-android/src/android-driver.ts packages/driver-android/test/android-v2-foreground-regression.test.ts packages/cli/src/android-product.ts packages/cli/test/android-foreground-regression.test.ts scripts/test-android-observer-security.mjs --max-warnings=0
          if ($LASTEXITCODE -ne 0) { throw "Changed-file lint failed." }

      - name: Validate patch whitespace
        shell: pwsh
        run: git diff --check

      - name: Commit verified implementation and generated observer assets
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/driver-android/src/android-driver.ts packages/driver-android/observer/src/org/tvdoctor/observer/ObserverAccessibilityService.java packages/driver-android/observer/tvdoctor-observer.apk packages/driver-android/observer/observer-manifest.json packages/cli/src/android-product.ts scripts/test-android-observer-security.mjs
          git diff --cached --check
          git commit -m "fix(android): enforce foreground integrity"
          git push origin HEAD:fix/android-v2-foreground-integrity
