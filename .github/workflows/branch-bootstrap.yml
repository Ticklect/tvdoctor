name: Branch bootstrap

on:
  push:
    branches: [fix/android-v2-foreground-integrity]
    paths:
      - .github/workflows/branch-bootstrap.yml

permissions:
  contents: write

jobs:
  restore-compatible-typescript:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/android-v2-foreground-integrity

      - name: Configure Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm

      - name: Restore supported TypeScript and lockfile
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'package.json';
          const pkg = JSON.parse(await readFile(path, 'utf8'));
          pkg.devDependencies.typescript = '6.0.3';
          await writeFile(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          npm install --package-lock-only --ignore-scripts

      - name: Commit regenerated dependency baseline
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --check
          git commit -m "fix(ci): restore compatible TypeScript baseline"
          git push origin HEAD:fix/android-v2-foreground-integrity
