<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TVDoctor consent wall fixture</title>
    <style>
      body { margin: 0; font: 16px system-ui, sans-serif; }
      header, main { padding: 16px; }
      dialog { max-width: 520px; padding: 24px; border-radius: 8px; }
      dialog::backdrop { background: rgba(0, 0, 0, .65); }
    </style>
  </head>
  <body data-screen="catalogue">
    <header><h1>Original catalogue</h1></header>
    <main>
      <nav aria-label="Catalogue">
        <button data-tv-id="catalogue-home">Home</button>
        <button data-tv-id="catalogue-library">Library</button>
      </nav>
    </main>
    <dialog id="consent" role="dialog" aria-modal="true" aria-labelledby="consent-title" data-tv-id="consent-dialog">
      <h2 id="consent-title">Privacy choice</h2>
      <p>This local modal represents production consent walls without third-party scripts.</p>
      <button data-tv-id="reject-consent">Reject nonessential</button>
      <button data-tv-id="accept-consent">Accept</button>
    </dialog>
    <iframe title="Catalogue frame" src="/iframe-child.html"></iframe>
    <script type="module">
      const consent = document.getElementById("consent");
      const accepted = sessionStorage.getItem("tvdoctor-fixture-consent") === "true";
      if (!accepted) consent.showModal();

      document.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" || !consent.open) return;
        event.preventDefault();
        document.activeElement.click();
      });
      document.addEventListener("click", (event) => {
        const target = event.target instanceof Element ? event.target.closest("button") : null;
        const action = target?.getAttribute("data-tv-id");
        if (action !== "accept-consent" && action !== "reject-consent") return;
        sessionStorage.setItem("tvdoctor-fixture-consent", "true");
        consent.close();
        document.querySelector('[data-tv-id="catalogue-home"]').focus();
      });
    </script>
  </body>
</html>
